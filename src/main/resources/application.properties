spring.application.name=taskflow

server.port=8080

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# PostgreSQL
spring.datasource.url=${TASKFLOW_DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${TASKFLOW_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TASKFLOW_DB_PASSWORD:${DB_PASSWORD:root}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

github.client-id=${GITHUB_CLIENT_ID:taskflow-dev-client-id}
github.client-secret=${GITHUB_CLIENT_SECRET:taskflow-dev-client-secret}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}

taskflow.worker.token=${TASKFLOW_WORKER_TOKEN:taskflow-worker-secret}
taskflow.worker.host=${TASKFLOW_WORKER_HOST:http://127.0.0.1:8081}